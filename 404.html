<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page Not Found – IIIHM</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1b2a;
    --navy-mid: #1a2e45;
    --gold: #b8943f;
    --gold-light: #d4af6a;
    --white: #ffffff;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    font-family: var(--sans);
    background: radial-gradient(ellipse at top, var(--navy-mid) 0%, var(--navy) 70%);
    color: var(--white);
    text-align: center;
  }

  main { max-width: 520px; }

  .brand {
    font-family: var(--serif);
    font-size: 1.5rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--gold-light);
  }
  .brand-sub {
    margin-top: 4px;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
  }

  .code {
    margin: 40px 0 8px;
    font-family: var(--serif);
    font-size: clamp(5rem, 22vw, 8rem);
    font-weight: 400;
    line-height: 1;
    color: var(--gold);
  }

  .rule {
    width: 60px;
    height: 1px;
    margin: 20px auto 24px;
    background: var(--gold);
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    font-weight: 400;
    line-height: 1.2;
  }
  h1 em { font-style: italic; color: var(--gold-light); }

  p {
    margin-top: 14px;
    font-size: 0.95rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.65);
  }

  .actions {
    margin-top: 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    padding: 14px 28px;
    border-radius: 6px;
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-decoration: none;
    transition: background 0.2s, color 0.2s, transform 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary { background: var(--gold); color: var(--white); }
  .btn-primary:hover { background: var(--gold-light); }
  .btn-outline { border: 1px solid rgba(212,175,106,0.5); color: var(--gold-light); }
  .btn-outline:hover { background: rgba(212,175,106,0.1); }
</style>
</head>
<body>
  <main>
    <div class="brand">IIIHM</div>
    <div class="brand-sub">IEM's International Institute of Hotel Management</div>

    <div class="code">404</div>
    <div class="rule"></div>

    <h1>This page has <em>checked out</em></h1>
    <p>The page you're looking for doesn't exist or may have moved. Let us show you back to the lobby.</p>

    <div class="actions">
      <a class="btn btn-primary" href="/">Back to Home</a>
      <a class="btn btn-outline" href="/#contact">Contact Us</a>
    </div>
  </main>
</body>
</html>
